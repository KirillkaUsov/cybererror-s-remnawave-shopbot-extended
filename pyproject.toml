[project]
name = "remnawave-shopbot-extended"
version = "1.5.7"
description = "Remnawave ShopBot Extended — бот и панель для автоматизации продаж VLESS VPN, форк проекта CyberERROR/remnawave-shopbot"
dependencies = [
    "aiogram==3.27.0",
    "flask==3.1.1",
    "flask-wtf==1.2.1",
    "httpx==0.27.2",
    "pyotp==2.9.0",
    "python-dotenv==1.1.1",
    "qrcode[pil]==8.2",
    "yookassa==3.5.0",
    "aiosend==2.1.2",
    "aiohttp==3.9.5",
    "aiohttp-sse-client==0.2.1",
    "pytonconnect==0.3.2",
    "paramiko==3.5.0",
    "colorama==0.4.6",
    "psutil==5.9.8",
    "setuptools>=65.0.0",

    
    "uvicorn>=0.29.0",
    "fastapi>=0.110.0",

    # нужен FastAPI для приёма файлов (вложения в поддержке)
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pylint",
    "black"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
