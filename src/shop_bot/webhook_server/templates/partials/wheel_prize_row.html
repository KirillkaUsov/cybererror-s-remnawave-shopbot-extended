{# Строка сектора колеса. Отдельный файл, потому что тот же кусок отдаётся
   в ответ на добавление сектора: рисовать новую строку скриптом — значит
   держать вторую копию разметки, которая рано или поздно разъедется. #}
<tr class="border-t border-white/5 align-middle" data-prize="{{ prize.prize_id }}">
    <td class="py-2 pr-3">
        <input type="checkbox" data-field="is_active" class="ui-switch" {{ 'checked' if prize.is_active else '' }}
            title="Участвует в розыгрыше">
    </td>
    <td class="py-2 pr-3"><input value="{{ prize.label }}" data-field="label"
            class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white text-sm focus:border-primary focus:outline-none"></td>
    <td class="py-2 pr-3">
        <select data-field="prize_type"
            class="bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white text-sm focus:border-primary focus:outline-none">
            <option value="days" {{ 'selected' if prize.prize_type == 'days' else '' }}>Дни к подписке</option>
            <option value="balance" {{ 'selected' if prize.prize_type == 'balance' else '' }}>Деньги на баланс</option>
            <option value="promo_percent" {{ 'selected' if prize.prize_type == 'promo_percent' else '' }}>Купон на скидку, %</option>
            <option value="promo_fixed" {{ 'selected' if prize.prize_type == 'promo_fixed' else '' }}>Купон на скидку, ₽</option>
            <option value="nothing" {{ 'selected' if prize.prize_type == 'nothing' else '' }}>Пусто</option>
        </select>
    </td>
    <td class="py-2 pr-3">
        <div class="flex items-center gap-1.5">
            <input type="number" step="1" min="0" value="{{ prize.amount | int }}" data-field="amount" data-stepper
                class="w-16">
            <span class="text-white/30 text-[11px]" data-unit></span>
        </div>
    </td>
    <td class="py-2 pr-3"><input type="number" step="1" min="1" value="{{ prize.weight }}" data-field="weight"
            data-stepper class="w-14"></td>
    <td class="py-2 pr-3 text-right"><span class="text-white/70 text-xs font-bold tabular-nums" data-chance>—</span></td>
    <td class="py-2 text-right">
        <button type="button" onclick="wheelDeletePrize({{ prize.prize_id }})"
            class="text-white/25 hover:text-red-400 transition-colors" title="Удалить сектор">
            <span class="material-symbols-outlined text-lg align-middle">delete</span></button>
    </td>
</tr>
